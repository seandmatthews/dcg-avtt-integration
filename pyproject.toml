[project]
name = "dcg-avtt-integration"
version = "0.5.0"
description = "The seam between dnd-campaign-generator (the canon core) and Atlas VTT (the at-the-table surface): everything that writes Atlas-owned file formats, so the core never knows Atlas exists."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

# No [build-system] on purpose, matching the campaign-generator family: an
# application tree, not an installable package. `uv run` treats this as a
# deps-only "virtual" project; the avtt package is reached via src/ on the
# path (see [tool.pytest.ini_options] below and run-tests.py).

[dependency-groups]
# ruff rides in the lock with everything else: CI installs via
# `uv sync --locked` (ticket 13), so a floating lint binary there would
# be the untested combination the lock exists to prevent.
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
# Lint = the runtime-crash class only (syntax errors, undefined names,
# unused imports/variables), matching the family's CI. Explicit select so
# newer ruff releases can't widen the scope under us.
lint.select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# The package lives at src/avtt; the project is never pip-installed, so the
# tests reach it by path.
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    # The golden-file suite (README §7.1) reads the pin's committed
    # capture fixtures/golden-<version>/sample.atlasmap. No addopts on
    # purpose (ticket 13): the plain suite is the whole suite — the
    # marker exists so `run-tests.py --all` / README §8 can run the
    # golden tests in isolation, never to deselect them.
    "integration: golden-file tests; run isolated via `run-tests.py --all`",
]
